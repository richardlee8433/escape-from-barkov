<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Escape from Barkov</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e1116;
        color: #e6edf3;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans",
          Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }
      #cv {
        display: block;
      }
      #center {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99;
        pointer-events: auto;
      }
      #center button {
        padding: 12px 20px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 10px;
        border: 0;
        background: #14a1ff;
        color: #081018;
        font-weight: 700;
        box-shadow: 0 6px 20px rgba(20, 161, 255, 0.3);
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 50;
        display: flex;
        gap: 10px;
        align-items: center;
        background: rgba(2, 6, 12, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 8px 10px;
        border-radius: 10px;
        backdrop-filter: blur(6px);
      }
      #hud .badge {
        padding: 2px 8px;
        border-radius: 6px;
        background: #121826;
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-variant-numeric: tabular-nums;
      }
      #ui-crosshair {
        position: fixed;
        top: calc(50% + 12px);
        left: 50%;
        width: 16px;
        height: 16px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 40;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 9999px;
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.35);
      }

      #log {
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 50;
        width: min(520px, 90vw);
        max-height: 35vh;
        overflow: auto;
        background: rgba(2, 6, 12, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 8px 10px;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.35;
      }
      #log div {
        opacity: 0.9;
      }
      #log .ok {
        color: #96f2d7;
      }
      #log .info {
        color: #91c9ff;
      }
      #log .warn {
        color: #ffd166;
      }
      #log .danger {
        color: #ff8585;
      }
      #version {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 50;
        padding: 6px 10px;
        border-radius: 10px;
        background: #0b1220;
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 12px;
        opacity: 0.85;
      }
      #death {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
        background: rgba(2, 6, 12, 0.8);
      }
      #death .card {
        background: #0b1220;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 18px 22px;
        border-radius: 12px;
        text-align: center;
      }
      #death .card h2 {
        margin: 0 0 8px;
      }
      #death .card a {
        display: inline-block;
        margin-top: 8px;
        padding: 8px 12px;
        background: #14a1ff;
        color: #081018;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 700;
      }
      .hidden {
        display: none;
      }
      #title-screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end; /* Button鈕靠下 */
        align-items: center;
        padding-bottom: 80px;
        background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.75)),
          url("./barkov_logo.png");
        background-size: 100% 100%; /* ✅ 強制鋪滿畫面 */
        background-position: center;
        background-repeat: no-repeat;
        color: #fff;
        z-index: 999;
        font-family: "Press Start 2P", sans-serif;
      }
      #title-screen button {
        margin-top: 10px;
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.9);
        color: #222;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      }
      #title-screen button:hover {
        background: #ff9f43;
        color: #000;
      }
      #title-screen small {
        margin-top: 14px;
        opacity: 0.7;
        font-size: 12px;
      }

      #title-screen.hidden,
      #howto.hidden {
        display: none;
      }
      #title-screen button,
      #howto button {
        margin-top: 10px;
        padding: 10px 20px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <canvas id="cv"></canvas>
    <div id="center">
      <button id="start" onclick="window.__start && window.__start()">
        Click to Start
      </button>
    </div>
    <!-- === v Start Screen === -->
    <div id="title-screen">
      <button id="btn-start">Start Game</button>
      <button id="btn-howto">How to Play</button>
      <small>v0.3.5</small>
    </div>

    <div id="howto" class="hidden">
      <h2>Controls</h2>
      <ul>
        <li>W / A / S / D – Move (relative to facing)</li>
        <li>Mouse – Aim / Turn</li>
        <li>Left Click – Fire</li>
        <li>E – Pick up item</li>
        <li>F – Interact (door / exit)</li>
        <li>1 / 2 / 3 – Use item</li>
      </ul>
      <button id="btn-close-howto">Close</button>
    </div>
    <!-- === End of Start Screen === -->

    <div id="hud" class="hidden">
      <div class="badge">❤️ HP: <span id="hp">100</span></div>
      <div class="badge">🔫 Ammo: <span id="ammo">30</span></div>
      <div class="badge">🎒 Loot: <span id="loot">0</span></div>
    </div>
    <!-- Hotbar UI -->
    <div
      id="hotbar"
      class="hidden"
      style="
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 60;
        background: rgba(2, 6, 12, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 8px 10px;
        border-radius: 10px;
        backdrop-filter: blur(6px);
      "
    >
      <div
        class="slot"
        data-idx="0"
        style="
          width: 56px;
          height: 56px;
          border-radius: 8px;
          border: 1px solid rgba(255, 255, 255, 0.12);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 12px;
          background: #0b1220;
        "
      >
        1
      </div>
      <div
        class="slot"
        data-idx="1"
        style="
          width: 56px;
          height: 56px;
          border-radius: 8px;
          border: 1px solid rgba(255, 255, 255, 0.12);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 12px;
          background: #0b1220;
        "
      >
        2
      </div>
      <div
        class="slot"
        data-idx="2"
        style="
          width: 56px;
          height: 56px;
          border-radius: 8px;
          border: 1px solid rgba(255, 255, 255, 0.12);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 12px;
          background: #0b1220;
        "
      >
        3
      </div>
    </div>

    <!-- 互動提示 -->
    <div
      id="pickupTip"
      class="hidden"
      style="
        position: fixed;
        bottom: 90px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 10px;
        border-radius: 8px;
        background: #0b1220;
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 12px;
        opacity: 0.9;
        z-index: 60;
      "
    >
      Button E Pickup
    </div>

    <div id="version">Escape from Barkov<strong>v0.3.4</strong></div>
    <div id="log" class="hidden"></div>
    <div id="death">
      <div class="card">
        <h2>You Died</h2>
        <p>Try Again！</p>
        <a id="retryLink" href="#">Restart</a>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "https://unpkg.com/three@0.164.1/build/three.module.js";
      import { GLTFLoader } from "https://unpkg.com/three@0.164.1/examples/jsm/loaders/GLTFLoader.js";

      var GAME_VERSION = "v0.3.5";

      // ===== Globals =====
      let scene, camera, renderer;

      let ground = null; // 地面 Mesh
      let gMat = null; // 地面材質
      let decorMeshes = []; // v0.3.4：把所有裝飾物收起來

      // 🌲 樹的簡易碰撞資料（用 2D 圓形即可）
      const treeColliders = []; // { x, z, r }

      const enemies = []; // 敵人陣列
      window.__enemies = enemies; // 方便你在 Console 檢查
      let bullets = []; // 子彈陣列

      const WORLD_SIZE = 1000;

      var player = {
        obj: null,
        mesh: null,
        speed: 50,
        hp: 100,
        ammo: 30,
        loot: 0,
        alive: true,
        halfSize: new THREE.Vector3(0.6, 1.7, 0.6),
      };

      // ===== Items / Inventory (NEW) =====
      const ITEM_TYPES = {
        MEDKIT: "medkit", // 回復 40 HP
        AMMO: "ammo", // 補充 15 發
        KEY: "key", // 關卡用（暫時不消耗）
      };
      const HOTBAR_SIZE = 3;

      let items = []; // 地上的物品清單
      let inventory = Array(HOTBAR_SIZE).fill(null); // 快捷欄 3 格
      let hotbarIndex = 0; // 目前選取格：0/1/2

      // UI refs
      const hotbarEl = document.getElementById("hotbar");
      const pickupTipEl = document.getElementById("pickupTip");
      const slotEls = () => Array.from(hotbarEl.querySelectorAll(".slot"));

      // 撿拾距離與顯示距離
      const PICKUP_RANGE = 15.0;
      // --- Enemy constants (declare BEFORE Enemy() is defined) ---
      const ENEMY_SCALE = 2.0; // 可調 1.6~2.0
      const ENEMY_BASE_R = 3.0; // 圓錐底半徑（原始尺寸）
      const ENEMY_BASE_H = 8.0; // 圓錐高度（原始尺寸）
      const BULLET_RADIUS = 0.8; // 若子彈命中用得到
      let ENEMY_DUCK_TEMPLATE = null;
      const clock = new THREE.Clock(); // ✅ 只宣告一次
      const wallColliders = [];
      const keyState = Object.create(null);
      const ENEMY_DETECT_DIST = 80; // 能「看到」玩家的最大距離
      const ENEMY_FOV_DEG = 70; // 視野角度（左右各 35°）
      const ENEMY_LOSE_SIGHT_TIME = 2.0; // 追擊看不到玩家後，維持追擊的秒數

      let totalKills = 0; // 用來做難度漸進

      function getDifficultyFactor() {
        const t = clock.getElapsedTime(); // 遊戲時間（秒）
        const timeFactor = 1 + t / 240; // 4 分鐘左右翻倍
        const killFactor = 1 + totalKills * 0.05; // 每殺一隻 +5%
        return Math.min(timeFactor * killFactor, 2.5); // 上限 2.5x
      }

      window.addEventListener(
        "keydown",
        (e) => (keyState[e.key.toLowerCase()] = true)
      );
      window.addEventListener(
        "keyup",
        (e) => (keyState[e.key.toLowerCase()] = false)
      );

      // ===== Hotbar / Item Controls =====

      window.addEventListener("keydown", (e) => {
        if (!started) return;
        if (e.code === "Digit1") setHotbarIndex(0);
        else if (e.code === "Digit2") setHotbarIndex(1);
        else if (e.code === "Digit3") setHotbarIndex(2);
      });

      // Button E Pickup
      // Button E：就近Pickup（用「水平距離」判斷）
      window.addEventListener("keydown", (e) => {
        if (!started || e.key.toLowerCase() !== "e") return;
        if (!player?.obj || !Array.isArray(items) || items.length === 0) {
          log("There are no items to pick up", "info");
          return;
        }

        const range2 = PICKUP_RANGE * PICKUP_RANGE;
        let nearest = null,
          bestD2 = Infinity;

        const px = player.obj.position.x;
        const pz = player.obj.position.z;

        for (const m of items) {
          const dx = px - m.position.x;
          const dz = pz - m.position.z;
          const d2 = dx * dx + dz * dz; // 只看水平距離
          if (d2 < bestD2) {
            bestD2 = d2;
            nearest = m;
          }
        }

        if (!nearest || bestD2 > range2) {
          log("There are no items to pick up", "info");
          return;
        }

        const type = nearest.userData?.type || "item";
        putIntoHotbar(type);
        scene.remove(nearest);
        items = items.filter((it) => it !== nearest);
        sfx.pickup && sfx.pickup();
        log(`Pickup ${type}`, "ok");
      });

      // Button 1~3：直接使用對應格物品（不需 F）
      window.addEventListener("keydown", (e) => {
        if (!started) return;

        let idx = null;
        if (e.code === "Digit1") idx = 0;
        else if (e.code === "Digit2") idx = 1;
        else if (e.code === "Digit3") idx = 2;
        if (idx === null) return;

        const cur = inventory[idx];
        if (!cur) {
          log("Slot ${idx + 1} is empty", "warn");
          return;
        }

        // 使用物品
        if (cur.type === ITEM_TYPES.MEDKIT) {
          const before = player.hp;
          player.hp = Math.min(100, player.hp + 40);
          updateHUD();
          sfx.heal && sfx.heal(); // 🔊 新增：回血音效
          log(
            `Used Medkit（Slot${idx + 1}）：HP ${Math.round(
              before
            )} → ${Math.round(player.hp)}`,
            "ok"
          );
          inventory[idx] = null;
          updateHotbarUI();
        } else if (cur.type === ITEM_TYPES.AMMO) {
          player.ammo += 15;
          updateHUD();
          log(`Used Ammo（Slot${idx + 1}）：Ammo +15`, "ok");
          inventory[idx] = null;
          updateHotbarUI();
        } else if (cur.type === ITEM_TYPES.KEY) {
          log(
            `Key（Slot${
              idx + 1
            }）：There are no available evacuation points at present.`,
            "info"
          );
        }
      });

      // ===== Helpers =====
      let __groundRay = null;
      function getGroundRay() {
        if (!__groundRay) __groundRay = new THREE.Raycaster();
        return __groundRay;
      }

      function getGroundYAt(x, z) {
        if (!ground) return 0; // 或回傳 hNoise(x,z)
        const r = getGroundRay();
        r.set(new THREE.Vector3(x, 9999, z), new THREE.Vector3(0, -1, 0));
        const hit = r.intersectObject(ground, true)[0];
        return hit ? hit.point.y : 0;
      }

      // ===== Item class (NEW) =====
      function createItemMesh(type) {
        // 固定幾何＋顏色；不做旋轉/跳動
        let geo, mat;
        if (type === ITEM_TYPES.MEDKIT) {
          geo = new THREE.BoxGeometry(1, 0.6, 1);
          mat = new THREE.MeshStandardMaterial({ color: 0x7bd88f });
        } else if (type === ITEM_TYPES.AMMO) {
          geo = new THREE.CylinderGeometry(0.45, 0.45, 0.9, 16);
          mat = new THREE.MeshStandardMaterial({ color: 0xffd166 });
        } else {
          geo = new THREE.TetrahedronGeometry(0.6, 0);
          mat = new THREE.MeshStandardMaterial({ color: 0x91c9ff });
        }
        const m = new THREE.Mesh(geo, mat);
        m.castShadow = false;
        m.receiveShadow = false;
        m.userData.type = type;
        return m;
      }

      function dropItem(type, x, z) {
        // 1) 先一定要有 mesh，這一行不能刪，避免 mesh is not defined
        const mesh = createItemMesh(type || ITEM_TYPES.MEDKIT);

        // 2) 基礎高度：用真實地形
        let y = getGroundYAt(x, z);
        if (!isFinite(y)) y = 0;

        // 3) 再做一次向下 Ray，確定真的打到地面
        const downRay = new THREE.Raycaster(
          new THREE.Vector3(x, y + 2, z),
          new THREE.Vector3(0, -1, 0)
        );
        const hit = ground ? downRay.intersectObject(ground, true)[0] : null;
        if (hit) {
          y = hit.point.y + 0.5; // ✅ 最後固定上抬 0.5，避免陷地
        } else {
          y = y + 0.5;
        }

        // 4) 設定位置
        mesh.position.set(x, y, z);

        // 5) 依玩家高度縮放（換模型也能對）
        const halfHeight = player?.halfSize?.y || 1.7;
        const scale = Math.max(0.6, (halfHeight * 0.5) / 1.7);
        mesh.scale.setScalar(scale);

        // 6) 放進場景＋清單
        scene.add(mesh);
        items.push(mesh);
      }

      // 簡單隨機撒一些物品（啟動時）
      function scatterItems() {
        const halfLocal = WORLD_SIZE / 2;
        const toSpawn = [
          { type: ITEM_TYPES.MEDKIT, count: 4 },
          { type: ITEM_TYPES.AMMO, count: 6 },
          { type: ITEM_TYPES.KEY, count: 1 },
        ];

        for (const { type, count } of toSpawn) {
          for (let i = 0; i < count; i++) {
            let x = Math.random() * WORLD_SIZE - halfLocal;
            let z = Math.random() * WORLD_SIZE - halfLocal;

            // ❗ 避開玩家出生附近，避免一開始就全撿了
            if (Math.abs(x) < 12) x += (x < 0 ? -1 : 1) * 12;
            if (Math.abs(z) < 12) z += (z < 0 ? -1 : 1) * 12;

            dropItem(type, x, z);
          }
        }
      }

      // --- Logger ---
      var logBox = document.getElementById("log");
      function log(msg, level) {
        var d = document.createElement("div");
        d.className = level || "info";
        d.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
        logBox.appendChild(d);
        logBox.scrollTop = logBox.scrollHeight;
      }

      // --- Audio ---
      var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      function beep(freq, dur, type, gain) {
        try {
          var o = audioCtx.createOscillator();
          var g = audioCtx.createGain();
          o.type = type || "square";
          o.frequency.value = freq;
          // SFX 預設音量（腳色 / 敵人 / 射擊 用這個）
          g.gain.value = gain != null ? gain : 0.06;
          o.connect(g).connect(audioCtx.destination);
          o.start();
          o.stop(audioCtx.currentTime + (dur || 0.12));
        } catch (e) {}
      }

      var sfx = {
        // 開局提示
        start: () => beep(440, 0.12, "square"),

        // 射擊 / 命中 / 撿東西 / 玩家死亡
        shoot: () => beep(880, 0.08, "triangle"),
        hit: () => beep(220, 0.06, "sawtooth"),
        pickup: () => beep(1200, 0.1, "square"),
        die: () => beep(140, 0.4, "sine"),

        // Player：受傷 & 用醫療包
        playerHurt: () => beep(320, 0.18, "square"), // 比較短的哀嚎 / 汪一聲
        heal: () => {
          // 兩個逐漸拉高的音階，像回血
          beep(880, 0.06, "square");
          beep(1320, 0.12, "square");
        },

        // Enemy（鴨鴨）
        enemyAlert: () => beep(760, 0.12, "square"), // 發現玩家：一聲「嘎！」
        enemyHurt: () => beep(260, 0.08, "triangle"), // 被打：低一點「嘎…」
        enemyDie: () => {
          // 死亡：下降音階「哇→啊」感
          beep(420, 0.08, "square");
          beep(260, 0.16, "square");
        },
      };

      let bgmEnabled = true;
      let bgmTimer = 0;
      let bgmStep = 0;
      const BGM_INTERVAL = 0.5; // 節奏速度
      const BGM_NOTES = [440, 660, 523, 392]; // 簡單 8bit 迴圈

      // === BGM（MP3） ===
      let bgmAudio = null;

      function startBgm() {
        // 每次開啟都重建一個新的 Audio，避免暫停後卡死
        if (bgmAudio) {
          bgmAudio.pause();
          bgmAudio = null;
        }
        bgmAudio = new Audio("./ass/audio/bgm.mp3"); // ← 改成你的音樂路徑
        bgmAudio.loop = true;
        bgmAudio.volume = 0.45;

        if (bgmEnabled) {
          bgmAudio.play().catch(() => {});
        }
      }

      function stopBgm() {
        if (bgmAudio) {
          bgmAudio.pause();
          bgmAudio.currentTime = 0;
          bgmAudio = null;
        }
      }

      window.addEventListener("keydown", (e) => {
        if (!started) return;
        if (e.key.toLowerCase() === "m") {
          bgmEnabled = !bgmEnabled;
          if (bgmEnabled) {
            startBgm();
            log("BGM ON (M)", "info");
          } else {
            stopBgm();
            log("BGM OFF (M)", "info");
          }
        }
      });

      // --- Start ---
      var started = false;
      function startGame() {
        if (started) return;
        started = true;

        try {
          audioCtx.resume();
        } catch (e) {}
        document.getElementById("center").style.display = "none";
        document.getElementById("hud").classList.remove("hidden");
        logBox.classList.remove("hidden");
        sfx.start();
        startBgm(); // 開局 BGM ON
        log("Game started " + GAME_VERSION, "ok");
        init();
        document.getElementById("btn-start").onclick = () => {
          document.getElementById("title-screen").classList.add("hidden");
          window.__start(); // 原本遊戲啟動邏輯
        };

        document.getElementById("btn-howto").onclick = () => {
          document.getElementById("howto").classList.remove("hidden");
        };

        document.getElementById("btn-close-howto").onclick = () => {
          document.getElementById("howto").classList.add("hidden");
        };
      }

      // ✅ 新增這行：提供 HTML onclick 的保底啟動方式
      window.__start = startGame;

      ["click", "pointerdown", "touchstart", "keydown"].forEach((e) =>
        window.addEventListener(e, startGame, { once: true, capture: true })
      );

      // --- THREE Scene ---
      var cv = document.getElementById("cv");
      renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      scene = new THREE.Scene();
      scene.background = null; // 交給 sky dome 處理
      scene.fog = new THREE.Fog(0xbfd4ff, 120, 420);

      // ===== Sky Dome（天空球）=====
      function createSkyDome() {
        const skyRadius = WORLD_SIZE * 0.9; // 夠大就好，整個世界包起來

        const skyGeo = new THREE.SphereGeometry(skyRadius, 32, 24);

        const skyMat = new THREE.ShaderMaterial({
          side: THREE.BackSide, // 從裡面看
          depthWrite: false,
          fog: false,
          uniforms: {
            uTopColor: { value: new THREE.Color(0x87b5ff) }, // 上層天空色
            uBottomColor: { value: new THREE.Color(0xe3f3ff) }, // 地平線附近的淡藍 / 接近白
            uOffset: { value: 0.0 },
            uExponent: { value: 1.5 }, // 越大漸層越集中在頂部
          },
          vertexShader: `
                  varying vec3 vWorldPosition;
                  void main() {
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    gl_Position = projectionMatrix * viewMatrix * worldPosition;
                  }
                `,
          fragmentShader: `
                  uniform vec3 uTopColor;
                  uniform vec3 uBottomColor;
                  uniform float uOffset;
                  uniform float uExponent;
                  varying vec3 vWorldPosition;

                  void main() {
                    // y 越高越接近 uTopColor，越低越接近 uBottomColor
                    float h = normalize(vWorldPosition + vec3(0.0, uOffset, 0.0)).y;
                    float f = max(pow(max(h, 0.0), uExponent), 0.0);
                    vec3 color = mix(uBottomColor, uTopColor, f);
                    gl_FragColor = vec4(color, 1.0);
                  }
                `,
        });

        const sky = new THREE.Mesh(skyGeo, skyMat);
        scene.add(sky);
      }

      createSkyDome();

      camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        2000
      );
      camera.position.set(0, 6, 12);

      var ambient = new THREE.AmbientLight(0xffffff, 0.35);
      scene.add(ambient);
      var dir = new THREE.DirectionalLight(0xffffff, 0.9);
      dir.position.set(8, 18, 10);
      scene.add(dir);

      const half = WORLD_SIZE / 2;

      // ===== Terrain v0.3.4 =====

      // 把原本的 `const seg = 220;` 改成這個常數
      const TERRAIN_SEGMENTS = 256;

      // ---- 強化版地形噪聲：value-noise + FBM（沿用你原本那套）----
      const SEED = Math.random() * 1000;
      function fract(x) {
        return x - Math.floor(x);
      }
      function hash2(x, z) {
        return fract(
          Math.sin((x + SEED) * 127.1 + (z - SEED) * 311.7) * 43758.5453123
        );
      }
      function smooth01(t) {
        return t * t * (3 - 2 * t);
      }

      // 單八度 value noise：回傳 0..1
      function vnoise(x, z, scale) {
        const fx = x * scale,
          fz = z * scale;
        const xi = Math.floor(fx),
          zi = Math.floor(fz);
        const tx = fx - xi,
          tz = fz - zi;

        const a = hash2(xi, zi);
        const b = hash2(xi + 1, zi);
        const c = hash2(xi, zi + 1);
        const d = hash2(xi + 1, zi + 1);

        const ux = smooth01(tx),
          uz = smooth01(tz);
        const ab = a + (b - a) * ux;
        const cd = c + (d - c) * ux;
        return ab + (cd - ab) * uz; // 0..1
      }

      // FBM：多八度加總，回傳高度位移（約 -8 ~ +8）
      function hNoise(x, z) {
        let h = 0;
        let amp = 6.0; // ↑ 調大更起伏
        let freq = 0.02; // ↑ 調大更細碎
        for (let o = 0; o < 5; o++) {
          h += (vnoise(x, z, freq) * 2 - 1) * amp;
          amp *= 0.5;
          freq *= 2.0;
        }
        return h;
      }

      // 之後要接 heightmap / mixed 時，可以從這裡擴充
      function sampleHeight(x, z, mode = "mixed", opt = {}) {
        // TODO: 之後接高度圖：
        // const hBase = sampleHeightmap(x, z, opt.heightmapTex) * opt.heightScale;
        // const hDetail = hNoise(x, z) * opt.detailAmp;
        // return hBase + hDetail;
        return hNoise(x, z); // 目前先純噪聲，但 API 已預留 mode/opt
      }

      function pathMaskAt(x, z, size = WORLD_SIZE) {
        // === 把世界座標轉成比例座標 ===
        const nx = x / (size * 0.5); // -1..1
        const nz = z / (size * 0.5); // -1..1

        // === 彎曲參數 ===
        const freq = 2.8; // 彎的次數
        const ampWorld = 150; // 彎幅（實際單位）
        const amp = ampWorld / (size * 0.5); // 轉成比例單位

        // S 型中心線
        const curveZ = Math.sin(nx * Math.PI * freq) * amp;

        // === 路寬設定（用實際世界單位轉成比例）===
        const innerWorld = 60; // 路中心半寬
        const outerWorld = 100; // 模糊區邊緣
        const inner = innerWorld / (size * 0.5);
        const outer = outerWorld / (size * 0.5);

        // === 計算距離與 mask ===
        const d = Math.abs(nz - curveZ);
        let m = 0;
        if (d < inner) m = 1.0; // 路中心
        else if (d < outer) m = 1.0 - (d - inner) / (outer - inner); // 漸層邊
        else m = 0.0; // 外面

        return m; // 0~1
      }

      // 給定 X，算出這個 X 上「道路中心」的 Z 座標
      function getPathCenterZ(x, size = WORLD_SIZE) {
        const nx = x / (size * 0.5);

        const freq = 2.8;
        const ampWorld = 150;
        const amp = ampWorld / (size * 0.5);

        const curveZ = Math.sin(nx * Math.PI * freq) * amp;
        return curveZ * (size * 0.5); // 把比例座標轉回世界座標
      }

      // 👉 新增這個：判斷「這一帶是不是路或路邊」
      function isNearPath(x, z, margin = 60) {
        // margin: 用世界單位。60 表示「整條路 + 路邊緩衝」
        const steps = 5; // 採樣密度，越大越準但越慢
        const step = margin / steps;
        let maxM = 0;

        // 掃一圈附近的小格
        for (let dx = -margin; dx <= margin; dx += step) {
          for (let dz = -margin; dz <= margin; dz += step) {
            const m = pathMaskAt(x + dx, z + dz);
            if (m > maxM) maxM = m;
          }
        }

        // mask > 0.01 的地方都算路或邊緣
        return maxM > 0.01;
      }

      // 原本就有的 import，保留，但移到這裡
      import {
        createTerrainFallbackMaterial,
        createTerrainTriplanarMaterial,
      } from "./TerrainMaterial.js";

      // 檢查某個位置附近是否已經有樹（避免重疊）
      function isCollidingWithTrees(x, z, radius) {
        for (const t of treeColliders) {
          const dx = x - t.x;
          const dz = z - t.z;
          const minDist = radius + t.r;
          if (dx * dx + dz * dz < minDist * minDist) {
            return true;
          }
        }
        return false;
      }

      // 在地形上疊一層「路」的 mesh
      function buildPathOverlay({
        mode = "mixed",
        size = WORLD_SIZE,
        seg = TERRAIN_SEGMENTS,
        heightmapTex = null,
      } = {}) {
        const pathGeo = new THREE.PlaneGeometry(size, size, seg, seg);
        const pos = pathGeo.attributes.position;
        const count = pos.count;
        const mask = new Float32Array(count);

        for (let i = 0; i < count; i++) {
          const vx = pos.getX(i);
          const vz = pos.getY(i); // PlaneGeometry 第二軸

          // 高度要跟地形一致，外加一點點偏移避免 Z-fighting
          const h = sampleHeight(vx, vz, mode, { heightmapTex });
          pos.setZ(i, h + 0.2);

          // 這裡算路的 Mask（0~1）
          const m = pathMaskAt(vx, vz, size);
          mask[i] = m;
        }

        pathGeo.setAttribute("mask", new THREE.BufferAttribute(mask, 1));
        pathGeo.computeVertexNormals();

        // 自訂 ShaderMaterial：有 mask 的地方畫土色，沒有就丟棄
        const pathMat = new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false, // 避免太硬的遮擋
          uniforms: {
            uColor: { value: new THREE.Color(0xcfa574) }, // 土路顏色
          },
          vertexShader: `
                        attribute float mask;
                        varying float vMask;
                        void main() {
                          vMask = mask;
                          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                      `,
          fragmentShader: `
              uniform vec3 uColor;
              varying float vMask;
              void main() {
                // 只畫「mask 比較大的中間區域」，縮小實際看的路寬
                if (vMask <= 0.3) discard;

                // 0.3 ~ 1.0 之間做一點平滑
                float alpha = smoothstep(0.3, 1.0, vMask);
                vec3 col = uColor;

                gl_FragColor = vec4(col, alpha);
              }
            `,
        });

        const pathMesh = new THREE.Mesh(pathGeo, pathMat);
        pathMesh.rotation.x = -Math.PI / 2;
        scene.add(pathMesh);

        // 若之後你想清空裝飾，可以順便把 pathMesh push 到 decorMeshes
        decorMeshes.push(pathMesh);
      }

      // v0.3.4 主角：地形生成器 v2
      async function buildTerrainV2({
        mode = "mixed",
        size = WORLD_SIZE,
        seg = TERRAIN_SEGMENTS,
        heightmapTex = null,
      } = {}) {
        const gGeo = new THREE.PlaneGeometry(size, size, seg, seg);

        // 套高度
        const pos = gGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const vx = pos.getX(i);
          const vz = pos.getY(i);
          const h = sampleHeight(vx, vz, mode, {
            heightmapTex,
            // heightScale: 15,
            // detailAmp: 2.5,
          });
          pos.setZ(i, h);
        }
        gGeo.computeVertexNormals();

        // 貼回你原本的 Triplanar 地形材質
        gMat = await createTerrainTriplanarMaterial({
          texUrls: {
            grass: "./textures/grass_2k.png",
            dirt: "./textures/dirt_2k.png",
            rock: "./textures/rock_2k.png",
            sand: "./textures/sand_2k.png",
          },
          worldSize: WORLD_SIZE,
          anisotropy: 16,
          scale: 16,
          // TODO: 未來可以在這裡多塞 maskTex / maskParams
        });

        ground = new THREE.Mesh(gGeo, gMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // 疊上路面 overlay
        buildPathOverlay({ mode, size, seg, heightmapTex });

        // 地形建好後順便把裝飾擺上去
        setupDecorator();
      }

      // 🚀 這行會在模組頂層直接生成地形（取代原本那一大段）
      await buildTerrainV2({
        mode: "mixed",
        // 之後要接高度圖時，這裡可以傳 heightmapTex
      });

      // ===== Decorator v0.3.4 =====

      function setupDecorator() {
        scatterTrees(50);
        scatterRocksAlongGround(250);
        scatterBoundaryTrees();
        scatterBoundaryBushes();
        pruneTreesOnPath(); // ✅ 最後清掉長在路上的樹
      }

      function makeTree() {
        const g = new THREE.Group();

        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.3, 0.4, 2, 6),
          new THREE.MeshStandardMaterial({
            color: 0x966a4a,
            flatShading: true,
          })
        );
        trunk.position.y = 1;
        trunk.castShadow = true;
        g.add(trunk);

        for (let i = 0; i < 3; i++) {
          const cone = new THREE.Mesh(
            new THREE.ConeGeometry(1.6 - i * 0.25, 1.2, 6),
            new THREE.MeshStandardMaterial({
              color: 0x3a7c3a,
              flatShading: true,
            })
          );
          cone.position.y = 1.7 + i * 0.7;
          cone.castShadow = true;
          g.add(cone);
        }
        return g;
      }

      function scatterTrees(count = 60) {
        const halfSize = WORLD_SIZE / 2;
        const baseRadius = 3; // 樹的「底部半徑」基準

        for (let i = 0; i < count; i++) {
          const x = Math.random() * WORLD_SIZE - halfSize;
          const z = Math.random() * WORLD_SIZE - halfSize;

          // 避開玩家出生區
          if (Math.abs(x) < 10 && Math.abs(z) < 10) {
            i--;
            continue;
          }

          // 避開路＆路邊一圈
          if (isNearPath(x, z)) {
            i--;
            continue;
          }

          // 隨機決定這棵樹的大小（注意：下面都用同一個 scale）
          const scale = 6 + Math.random() * 3;
          const radius = baseRadius * scale;

          // ❌ 如果跟其他樹重疊，就重抽
          if (isCollidingWithTrees(x, z, radius)) {
            i--;
            continue;
          }

          const y = getGroundYAt(x, z);
          const tree = makeTree();
          tree.position.set(x, y, z);
          tree.scale.setScalar(scale);
          tree.rotation.y = Math.random() * Math.PI * 2;

          // ✅ 加進場景 & 裝飾
          scene.add(tree);
          decorMeshes.push(tree);

          // ✅ 加進樹的碰撞資料（給之後的新樹 / 石頭避開）
          treeColliders.push({ x, z, r: radius });

          // ✅ 把樹也當成牆的一種：玩家不能穿過樹
          tree.userData.isTree = true;
          wallColliders.push(tree);
        }
      }

      function makeBush() {
        const g = new THREE.DodecahedronGeometry(1.0, 0);
        g.computeVertexNormals();
        const m = new THREE.MeshStandardMaterial({
          color: 0x1f6b2f,
          flatShading: true,
        });
        const bush = new THREE.Mesh(g, m);
        bush.castShadow = true;
        return bush;
      }

      function scatterBoundaryBushes() {
        const half = WORLD_SIZE / 2;
        const innerOffset = 18; // 比樹再靠外一點，貼著邊界
        const step = 10; // 比樹更密

        const baseRadius = 5; // 碰撞半徑基準

        // 上下邊
        for (let x = -half; x <= half; x += step) {
          const jitter = (Math.random() - 0.5) * 6;
          const px = x + jitter;

          // 上邊
          let pz = half - innerOffset;
          placeBoundaryBush(px, pz, baseRadius);

          // 下邊
          pz = -half + innerOffset;
          placeBoundaryBush(px, pz, baseRadius);
        }

        // 左右邊
        for (let z = -half; z <= half; z += step) {
          const jitter = (Math.random() - 0.5) * 6;
          const pz = z + jitter;

          let px = half - innerOffset;
          placeBoundaryBush(px, pz, baseRadius);

          px = -half + innerOffset;
          placeBoundaryBush(px, pz, baseRadius);
        }
        // ✅ 再補角落小灌木，避免因地形或樹 jitter 造成縫
        const c = half - 20;
        const bushPositions = [
          [c, c],
          [-c, c],
          [c, -c],
          [-c, -c],
        ];

        for (const [x, z] of bushPositions) {
          const y = getGroundYAt(x, z) + 0.2;
          const bush = makeBush();
          const scale = 5 + Math.random() * 2;
          bush.position.set(x, y, z);
          bush.scale.setScalar(scale);
          bush.rotation.y = Math.random() * Math.PI * 2;
          scene.add(bush);
          decorMeshes.push(bush);
        }
      }

      function placeBoundaryBush(x, z, baseRadius) {
        const y = getGroundYAt(x, z) + 0.2;

        // 避開大樹：不要直接長在樹幹裡
        if (isCollidingWithTrees(x, z, baseRadius * 1.2)) return;

        const bush = makeBush();
        const scale = 4 + Math.random() * 2; // 比路邊的小樹矮一些，但夠大遮縫
        bush.position.set(x, y, z);
        bush.scale.set(scale, scale * 0.7, scale); // 壓扁一點像灌木
        bush.rotation.y = Math.random() * Math.PI * 2;

        scene.add(bush);
        decorMeshes.push(bush);

        // 可以讓灌木也擋路（或你想只擋視覺就不要加 wallColliders）
        const r = baseRadius * scale;
        treeColliders.push({ x, z, r });
        wallColliders.push(bush);

        bush.userData.isBoundaryBush = true;
      }

      function scatterRocksAlongGround(count = 250) {
        const geo = new THREE.DodecahedronGeometry(0.4, 0);
        const mat = new THREE.MeshStandardMaterial({
          color: 0x8a7f73,
          roughness: 1,
          metalness: 0,
        });
        const inst = new THREE.InstancedMesh(geo, mat, count);

        const m4 = new THREE.Matrix4();
        const q = new THREE.Quaternion();
        const s = new THREE.Vector3();
        const p3 = new THREE.Vector3();
        const halfSize = WORLD_SIZE / 2;

        const rockBaseRadius = 2.0; // 石頭底部半徑基準

        for (let i = 0; i < count; i++) {
          let x = Math.random() * WORLD_SIZE - halfSize;
          let z = Math.random() * WORLD_SIZE - halfSize;

          // 避開玩家出生區
          if (Math.abs(x) < 10 && Math.abs(z) < 10) {
            i--;
            continue;
          }

          // 避開路＆路邊
          if (isNearPath(x, z)) {
            i--;
            continue;
          }

          // 避開樹：石頭也不要貼在樹根旁邊
          const rockScale = 4 + Math.random() * 3;
          const rockRadius = rockBaseRadius * rockScale;
          if (isCollidingWithTrees(x, z, rockRadius + 4)) {
            // +4 給一點安全距離，看起來比較自然
            i--;
            continue;
          }

          const y = getGroundYAt(x, z) + 0.2;
          p3.set(x, y, z);
          q.setFromEuler(new THREE.Euler(0, Math.random() * Math.PI * 2, 0));
          s.setScalar(rockScale);
          m4.compose(p3, q, s);
          inst.setMatrixAt(i, m4);
        }

        inst.instanceMatrix.needsUpdate = true;
        scene.add(inst);
        decorMeshes.push(inst);
      }

      // 單棵邊界大樹
      function placeBoundaryTree(x, z) {
        const y = getGroundYAt(x, z);

        const tree = makeTree();
        const scale = 10 + Math.random() * 4; // 比一般樹大一圈
        tree.position.set(x, y, z);
        tree.scale.setScalar(scale);
        tree.rotation.y = Math.random() * Math.PI * 2;

        scene.add(tree);
        decorMeshes.push(tree);

        // 當成牆：防止玩家出去
        const radius = 5 * scale;

        wallColliders.push(tree);

        tree.userData.isBoundaryTree = true;
      }

      // 在四邊生成三圈大樹：森林牆
      function scatterBoundaryTrees() {
        const half = WORLD_SIZE / 2;

        // 三排樹，從內到外
        const rowOffsets = [25, 15, 5];
        const baseStep = 20; // 理論間距

        // === 上下邊（沿 X 排）===
        for (let x = -half; x <= half; x += baseStep) {
          // 沿著邊界方向比較大的 jitter，打破直線
          const tangentialJitter = (Math.random() - 0.5) * baseStep * 0.8; // 約 -8~8
          const px = x + tangentialJitter;

          for (const off of rowOffsets) {
            // 往內外方向再抖一點，讓三排也不完全平行
            const radialJitter = (Math.random() - 0.5) * 6;
            // 下邊
            placeBoundaryTree(px, -half + off + radialJitter);
            // 上邊
            placeBoundaryTree(px, half - off + radialJitter);
          }
        }

        // === 左右邊（沿 Z 排）===
        for (let z = -half; z <= half; z += baseStep) {
          const tangentialJitter = (Math.random() - 0.5) * baseStep * 0.8;
          const pz = z + tangentialJitter;

          for (const off of rowOffsets) {
            const radialJitter = (Math.random() - 0.5) * 6;
            // 左邊
            placeBoundaryTree(-half + off + radialJitter, pz);
            // 右邊
            placeBoundaryTree(half - off + radialJitter, pz);
          }
        }

        // 角落補一棵，防止極端情況有大洞
        const c = half - rowOffsets[rowOffsets.length - 1];
        placeBoundaryTree(c, c);
        placeBoundaryTree(-c, c);
        placeBoundaryTree(c, -c);
        placeBoundaryTree(-c, -c);
      }

      // 把已經長在路上的樹清掉（用真正的 pathMaskAt 判斷）
      function pruneTreesOnPath() {
        for (let i = decorMeshes.length - 1; i >= 0; i--) {
          const m = decorMeshes[i];
          if (!m || !m.userData || !m.userData.isTree) continue;

          if (
            m.userData &&
            (m.userData.isBoundaryTree || m.userData.isBoundaryBush)
          ) {
            continue;
          }

          const x = m.position.x;
          const z = m.position.z;

          // 用 pathMaskAt 做一次「精準判斷」
          const mask = pathMaskAt(x, z);

          // 門檻可以調：0.25 越大越保守，樹離路越遠
          if (mask > 0.9) {
            // 從場景移除這棵樹
            scene.remove(m);
            decorMeshes.splice(i, 1);

            // 從 treeColliders 移除對應資料（用 x,z 大致匹配）
            for (let j = treeColliders.length - 1; j >= 0; j--) {
              const t = treeColliders[j];
              const dx = t.x - x;
              const dz = t.z - z;
              if (dx * dx + dz * dz < 1) {
                treeColliders.splice(j, 1);
                break;
              }
            }

            // 從 wallColliders 裡也拿掉，避免多算碰撞
            const idx = wallColliders.indexOf(m);
            if (idx >= 0) wallColliders.splice(idx, 1);
          }
        }
      }

      // 之後如果要重生地圖，可以呼叫這個清掉裝飾物
      function clearDecor() {
        for (const m of decorMeshes) {
          scene.remove(m);
          if (m.dispose) m.dispose();
        }
        decorMeshes.length = 0;
      }

      // ====== Mouse Aim / Crosshair (single source of truth) ======
      var mouse = new THREE.Vector2();
      var aimPoint = null;
      var aimRay = new THREE.Raycaster();
      var hasMouse = false;

      // 3D 地面準心
      var crosshair = new THREE.Mesh(
        new THREE.RingGeometry(0.35, 0.45, 32),
        new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.9,
        })
      );
      crosshair.rotation.x = -Math.PI / 2;
      crosshair.renderOrder = 999;
      crosshair.visible = false;
      scene.add(crosshair);

      function updateAimFromMouse(ev) {
        hasMouse = true;
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
      }

      // ✅ 綁在全域，避免被 HUD 擋住
      window.addEventListener("mousemove", updateAimFromMouse);
      window.addEventListener("pointermove", updateAimFromMouse);

      renderer.domElement.addEventListener("mousemove", updateAimFromMouse);

      // 讓主角永遠面向準心（若有）
      function facePlayerToAim(lerp) {
        if (!aimPoint || !player.obj) return;
        var dx = aimPoint.x - player.obj.position.x;
        var dz = aimPoint.z - player.obj.position.z;
        var ang = Math.atan2(dx, dz);
        var cur = player.obj.rotation.y;
        var diff = ang - cur;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        player.obj.rotation.y = cur + diff * (lerp || 0.25);
      }

      function makeWall(x, z, w, h) {
        var wall = new THREE.Mesh(
          new THREE.BoxGeometry(w, 6, h),
          new THREE.MeshStandardMaterial({ color: 0x2a3a52 })
        );
        wall.position.set(x, 3, z);
        scene.add(wall);
        wallColliders.push(wall);
      }
      makeWall(0, -half, WORLD_SIZE, 2);
      makeWall(0, half, WORLD_SIZE, 2);
      makeWall(-half, 0, 2, WORLD_SIZE);
      makeWall(half, 0, 2, WORLD_SIZE);

      async function loadDog(url) {
        const gltfLoader = new GLTFLoader();
        try {
          const gltf = await new Promise((res, rej) => {
            gltfLoader.load(url, res, undefined, rej);
          });
          return gltf.scene;
        } catch (e) {
          console.warn("GLTF load failed, use capsule:", e);
          return null;
        }
      }

      // 敵人專用：載入 voxel 鴨

      async function loadEnemyDuck() {
        if (ENEMY_DUCK_TEMPLATE) return ENEMY_DUCK_TEMPLATE;

        const loader = new GLTFLoader();
        const gltf = await new Promise((res, rej) => {
          loader.load("./voxel_duck.glb", res, undefined, rej);
        }).catch(() => null);

        if (!gltf) return null;

        const root = new THREE.Group();
        root.add(gltf.scene);
        // 🔄 讓鴨鴨的「正面」對齊 +Z 方向（跟 AI / FOV 用的方向一致）
        gltf.scene.rotation.y = Math.PI;

        // 歸一化一下，確保腳在 0
        const box = new THREE.Box3().setFromObject(root);
        const size = new THREE.Vector3();
        box.getSize(size);

        const targetHeight = 30; // 敵人高度
        const currentHeight = size.y || 30;
        const scale = targetHeight / currentHeight;
        root.scale.setScalar(scale);

        const box2 = new THREE.Box3().setFromObject(root);
        const center = new THREE.Vector3();
        box2.getCenter(center);

        // 把中心拉回 0,0,0，腳貼地
        root.position.x -= center.x;
        root.position.z -= center.z;
        root.position.y -= box2.min.y;

        ENEMY_DUCK_TEMPLATE = root;
        return ENEMY_DUCK_TEMPLATE;
      }

      async function makePlayer() {
        // 路的「起點」：世界左邊一點的位置
        const margin = 60;
        const startX = -WORLD_SIZE / 2 + margin;
        const startZ = getPathCenterZ(startX); // 這個 X 上的道路中心
        const y = getGroundYAt(startX, startZ) + 1.5;

        const dog = await loadDog("./luug_corgi_tales_of_arcadia.glb");

        const root = new THREE.Group();
        root.position.set(startX, y, startZ);
        scene.add(root);

        if (dog) {
          const box = new THREE.Box3().setFromObject(dog);
          const size = new THREE.Vector3();
          box.getSize(size);

          const targetHeight = 30;
          const currentHeight = size.y || 30;
          const scale = targetHeight / currentHeight;
          dog.scale.setScalar(scale);

          const box2 = new THREE.Box3().setFromObject(dog);
          const center = new THREE.Vector3();
          box2.getCenter(center);

          dog.position.x -= center.x;
          dog.position.z -= center.z;
          dog.position.y -= box2.min.y;

          root.add(dog);
          player.mesh = dog;
        } else {
          const capsule = new THREE.Mesh(
            new THREE.CapsuleGeometry(0.6, 1.4, 8, 16),
            new THREE.MeshStandardMaterial({ color: 0x14a1ff })
          );
          root.add(capsule);
          player.mesh = capsule;
        }

        player.obj = root;

        // 撿一次實際尺寸當碰撞盒
        const finalBox = new THREE.Box3().setFromObject(root);
        const finalSize = new THREE.Vector3();
        finalBox.getSize(finalSize);
        player.halfSize.set(
          Math.max(0.5, finalSize.x * 0.5),
          Math.max(0.9, finalSize.y * 0.5),
          Math.max(0.5, finalSize.z * 0.5)
        );

        // 讓主角一開始就面向「往終點的方向」（+X 那一側）
        const lookX = startX + 40;
        const lookZ = getPathCenterZ(lookX);
        const yaw = Math.atan2(lookX - startX, lookZ - startZ);
        root.rotation.y = yaw;

        camera.lookAt(root.position);
      }

      // --- Input ---

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }
      function resolveCollision(next) {
        if (!Array.isArray(wallColliders) || wallColliders.length === 0)
          return next;
        next.x = clamp(next.x, -half + 2, half - 2);
        next.z = clamp(next.z, -half + 2, half - 2);
        var pbox = new THREE.Box3().setFromCenterAndSize(
          new THREE.Vector3(next.x, 1 + player.halfSize.y, next.z),
          new THREE.Vector3(
            player.halfSize.x * 2,
            player.halfSize.y * 2,
            player.halfSize.z * 2
          )
        );
        for (let w of wallColliders) {
          var box = new THREE.Box3().setFromObject(w);
          if (box.intersectsBox(pbox)) {
            var dx1 = Math.abs(box.max.x - pbox.min.x),
              dx2 = Math.abs(pbox.max.x - box.min.x),
              dz1 = Math.abs(box.max.z - pbox.min.z),
              dz2 = Math.abs(pbox.max.z - box.min.z),
              minPen = Math.min(dx1, dx2, dz1, dz2);
            if (minPen === dx1) next.x = box.max.x + player.halfSize.x + 0.01;
            else if (minPen === dx2)
              next.x = box.min.x - player.halfSize.x - 0.01;
            else if (minPen === dz1)
              next.z = box.max.z + player.halfSize.z + 0.01;
            else next.z = box.min.z - player.halfSize.z - 0.01;
          }
        }
        return next;
      }

      // --- Enemy ---
      function Enemy(x, z) {
        this.hp = 30;
        this.speed = 25;
        this.state = "patrol"; // 'patrol' | 'chase' | 'search'
        this.fireCd = 0;
        this.loseSightTimer = 0;
        this.lastKnownPlayerPos = new THREE.Vector3(x, 0, z);
        this.patrolDir = Math.random() * Math.PI * 2; // 巡邏方向

        this.origin = new THREE.Vector3(x, 0, z);
        this.fireCd = 0;
        this.root = new THREE.Group();

        const gy = getGroundYAt(x, z);
        this.root.position.set(x, gy, z);
        scene.add(this.root);

        this.mesh = null;
        this.hitR = 1.0; // 先給一個，等載入後再調

        // 真正載模型
        loadEnemyDuck().then((tmpl) => {
          if (!tmpl) return;
          const inst = tmpl.clone(true);
          // ✅ 不旋轉：就維持模型原本朝向
          this.root.add(inst);
          this.mesh = inst;

          // 命中半徑依模型再抓一次
          const box = new THREE.Box3().setFromObject(inst);
          const size = new THREE.Vector3();
          box.getSize(size);
          this.hitR = Math.max(size.x, size.z) * 0.6;
        });
      }

      Enemy.prototype.update = function (dt) {
        if (!player.alive) return;
        if (!this.root) return;

        const playerPos = player.obj.position;
        const myPos = this.root.position;

        const dx = playerPos.x - myPos.x;
        const dz = playerPos.z - myPos.z;
        const dist = Math.hypot(dx, dz);

        // ===== 視野判定（距離 + 夾角） =====
        let canSeePlayer = false;
        if (dist < ENEMY_DETECT_DIST) {
          const toPlayer = new THREE.Vector3(dx, 0, dz).normalize();

          // 敵人朝向（根據 mesh.rotation.y）
          let forward;
          if (this.mesh) {
            const yaw = this.mesh.rotation.y;
            forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
          } else {
            forward = new THREE.Vector3(0, 0, 1);
          }

          const dot = forward.dot(toPlayer);
          const fovRad = (ENEMY_FOV_DEG * Math.PI) / 180;
          const cosHalf = Math.cos(fovRad / 2);
          if (dot >= cosHalf) {
            canSeePlayer = true;
          }
        }

        // 難度係數（時間 + 擊殺數）
        const diff = getDifficultyFactor();
        const moveSpeed =
          (this.baseSpeed || this.speed || 22) * (0.8 + 0.4 * diff);
        const desiredDist = 10; // 追擊時與玩家大約保持距離

        // ===== 更新「最後看見玩家的位置」 & 失去視線計時 =====
        if (canSeePlayer) {
          this.lastKnownPlayerPos.copy(playerPos);
          this.loseSightTimer = 0;
        } else if (this.state === "chase") {
          this.loseSightTimer += dt;
          if (this.loseSightTimer > ENEMY_LOSE_SIGHT_TIME) {
            this.state = "search";
          }
        }

        // ===== 狀態機 =====
        switch (this.state) {
          case "patrol": {
            // 在原地附近隨機繞圈
            this.patrolDir += (Math.random() - 0.5) * dt * 0.5;
            const dir = new THREE.Vector3(
              Math.cos(this.patrolDir),
              0,
              Math.sin(this.patrolDir)
            );
            this.root.position.addScaledVector(dir, moveSpeed * 0.4 * dt);

            if (canSeePlayer) {
              this.state = "chase";
              sfx.enemyAlert && sfx.enemyAlert(); // 發現玩家「嘎！」
            }
            break;
          }
          case "chase": {
            if (dist > desiredDist) {
              const dir = new THREE.Vector3(dx, 0, dz).normalize();
              this.root.position.addScaledVector(dir, moveSpeed * dt);
            }
            // 失去視線的計數在上面 already 處理
            break;
          }
          case "search": {
            // 往最後看見玩家的點走過去
            const toLast = this.lastKnownPlayerPos.clone().sub(myPos);
            if (toLast.lengthSq() > 1) {
              toLast.normalize();
              this.root.position.addScaledVector(toLast, moveSpeed * 0.7 * dt);
            } else {
              // 到達該點還是沒看到 → 回到巡邏
              this.state = "patrol";
            }
            if (canSeePlayer) {
              this.state = "chase";
              this.loseSightTimer = 0;
              sfx.enemyAlert && sfx.enemyAlert();
            }
            break;
          }
        }

        // ===== 貼地 =====
        const gy = getGroundYAt(this.root.position.x, this.root.position.z);
        this.root.position.y = gy;

        // ===== 水平轉向玩家（只改 y）=====
        if (this.mesh) {
          const ang = Math.atan2(dx, dz);
          // 不要再 + Math.PI，不然會剛好背對玩家
          this.mesh.rotation.set(0, ang, 0);
        }

        // ===== 射擊：只有「看得到」玩家才開火 =====
        this.fireCd -= dt;
        if (canSeePlayer && dist < 26 && this.fireCd <= 0) {
          const from = this.root.position
            .clone()
            .add(new THREE.Vector3(0, 1.0, 0));
          const dir = playerPos
            .clone()
            .add(new THREE.Vector3(0, 1, 0))
            .sub(from)
            .setY(0);
          spawnBullet(from, dir, "enemy");

          const baseCd = 1.4;
          this.fireCd = baseCd / (0.7 + 0.5 * diff) + Math.random() * 0.3;
        }
      };

      Enemy.prototype.faceTo = function (t, l) {
        var dx = t.x - this.mesh.position.x,
          dz = t.z - this.mesh.position.z,
          ang = Math.atan2(dx, dz),
          cur = this.mesh.rotation.y,
          diff = ang - cur;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        this.mesh.rotation.y = cur + diff * (l || 0.1);
      };

      function spawnEnemies(n) {
        // 保底：確保是陣列
        if (!Array.isArray(enemies)) enemies = [];

        const halfSize = WORLD_SIZE / 2;

        // 玩家位置（避免太靠近玩家出生）
        const px = player?.obj?.position?.x ?? 0;
        const pz = player?.obj?.position?.z ?? 0;

        const MIN_FROM_PLAYER = 50; // 敵人出生要離玩家至少這麼遠
        const MIN_BETWEEN_ENEMIES = 30; // 敵人之間至少距離

        for (let i = 0; i < n; i++) {
          let ex = 0,
            ez = 0;
          let ok = false;

          // 給每一隻最多嘗試幾次，避免死迴圈
          for (let tries = 0; tries < 40 && !ok; tries++) {
            // 整張地圖隨機，但留一點邊界
            ex = Math.random() * (WORLD_SIZE - 40) - (WORLD_SIZE - 40) / 2;
            ez = Math.random() * (WORLD_SIZE - 40) - (WORLD_SIZE - 40) / 2;

            // 1) 避開玩家附近
            const dxp = ex - px;
            const dzp = ez - pz;
            if (Math.hypot(dxp, dzp) < MIN_FROM_PLAYER) continue;

            // 2) 避開其他敵人，讓分布更均勻
            let tooClose = false;
            for (const en of enemies) {
              if (!en || !en.root) continue;
              const dx = ex - en.root.position.x;
              const dz = ez - en.root.position.z;
              if (Math.hypot(dx, dz) < MIN_BETWEEN_ENEMIES) {
                tooClose = true;
                break;
              }
            }
            if (tooClose) continue;

            ok = true;
          }

          enemies.push(new Enemy(ex, ez));
        }

        log(`Enemy spawned x${n}（spread across map）`, "warn");
      }

      // ===== Loot drop on enemy death 0.3.3 =====
      function pickDropType() {
        const r = Math.random();
        // 掉落機率：彈藥 50% / 醫療包 35% / 鑰匙 10% / 不掉 5%
        if (r < 0.5) return ITEM_TYPES.AMMO;
        if (r < 0.85) return ITEM_TYPES.MEDKIT;
        if (r < 0.95) return ITEM_TYPES.KEY;
        return null;
      }

      function dropLootAtEnemy(enemy) {
        const type = pickDropType();
        if (!type) return;
        const pos = enemy.root ? enemy.root.position : enemy.mesh.position;
        dropItem(type, pos.x, pos.z);
        log(`Drop：${type}`, "info");
      }

      // ====== Bullets ======
      const BULLET_GEO = new THREE.SphereGeometry(1.5, 8, 8);
      const BULLET_MAT = new THREE.MeshBasicMaterial({ color: 0xffe08a });

      function Bullet(from, dir, speed, maxDist, owner) {
        this.mesh = new THREE.Mesh(BULLET_GEO, BULLET_MAT);
        this.mesh.position.copy(from);
        this.dir = dir.clone().normalize();
        this.speed = speed || 3000;
        this.traveled = 0;
        this.maxDist = maxDist || 100;
        this.owner = owner || "player"; // 'player' | 'enemy'

        // ---- 子彈外觀延展：讓它沿 Z 軸變長，看起來像有拖尾 ----
        this.mesh.scale.set(
          1, // X
          1, // Y
          4 // Z ← 改成 4 表示拉長 4 倍，可依需求改 2~6
        );

        // 讓子彈的朝向對準飛行方向
        this.mesh.quaternion.setFromUnitVectors(
          new THREE.Vector3(0, 0, 1), // 幾何原本前向
          this.dir.clone().normalize() // 目前飛行方向
        );

        scene.add(this.mesh);
      }
      Bullet.prototype.update = function (dt) {
        var step = this.speed * dt;
        this.mesh.position.addScaledVector(this.dir, step);
        this.traveled += step;

        // 簡易碰撞：碰到敵人（玩家子彈）或玩家（敵方子彈）
        if (this.owner === "player") {
          for (let i = 0; i < enemies.length; i++) {
            const en = enemies[i];
            if (!en || !en.root) continue;

            const ex = en.root.position.x;
            const ez = en.root.position.z;
            const dx = this.mesh.position.x - ex;
            const dz = this.mesh.position.z - ez;
            const hDist = Math.hypot(dx, dz);

            if (hDist < (en.hitR || 1.2) + BULLET_RADIUS) {
              en.hp -= 20;

              if (en.hp > 0) {
                // 被打到：短暫退後 + 低音「嘎…」
                sfx.enemyHurt && sfx.enemyHurt();

                const away = new THREE.Vector3(
                  en.root.position.x - this.mesh.position.x,
                  0,
                  en.root.position.z - this.mesh.position.z
                )
                  .normalize()
                  .multiplyScalar(4); // 退後的距離，可以再調

                en.root.position.add(away);
              } else {
                // 死亡：下降音階
                if (sfx.enemyDie) sfx.enemyDie();
                else sfx.hit && sfx.hit();

                dropLootAtEnemy(en);
                scene.remove(en.root);
                enemies.splice(i, 1);
                player.loot += 1;
                totalKills++; // 給難度係數用
                updateHUD();
                log("Enemy down，Loot +1", "ok");
              }

              this.traveled = this.maxDist + 1;
              break;
            }
          }
        } else {
          // 敵人子彈打玩家
          if (!player || !player.obj) return true;

          const px = player.obj.position.x;
          const pz = player.obj.position.z;
          const dx = this.mesh.position.x - px;
          const dz = this.mesh.position.z - pz;
          const hDist = Math.hypot(dx, dz); // 只看水平距離

          // 依玩家寬度 + 子彈半徑估一個命中範圍
          const hitR =
            Math.max(player.halfSize.x, player.halfSize.z) +
            BULLET_RADIUS * 0.5;

          if (hDist < hitR) {
            // 一發固定扣血，你可以再調大小
            damagePlayer(20);
            this.traveled = this.maxDist + 1;
          }
        }

        // 打到牆就消失（用 colliders 的 AABB 粗判）
        if (Array.isArray(wallColliders)) {
          for (let w of wallColliders) {
            const box = new THREE.Box3().setFromObject(w);
            if (box.containsPoint(this.mesh.position)) {
              this.traveled = this.maxDist + 1;
              break;
            }
          }
        }

        if (this.traveled > this.maxDist) {
          scene.remove(this.mesh);
          return false; // dead
        }
        return true;
      };

      function spawnBullet(from, dir, owner) {
        // 提高子彈速度：玩家 > 敵人，整體看起來更有速度感
        const speed = owner === "enemy" ? 70 : 110; // 原本 22 / 34
        const maxDist = 120; // 原本 50，讓子彈飛遠一點再消失

        bullets.push(new Bullet(from, dir, speed, maxDist, owner || "player"));
      }

      // ====== Combat (用子彈而非立即 Raycast) ======
      window.addEventListener("mousedown", (e) => {
        if (!started || !player.alive) return;
        if (e.button !== 0) return;
        if (player.ammo <= 0) {
          log("No ammo！", "danger");
          return;
        }
        if (!aimPoint) return;

        player.ammo--;
        updateHUD();
        sfx.shoot();

        // 從玩家中心（略高）往準心方向發射
        const from = player.obj.position
          .clone()
          .add(new THREE.Vector3(0, 1.2, 0));
        const dir = aimPoint.clone().sub(from).setY(0); // 只在地面方向射
        spawnBullet(from, dir, "player");
      });

      function damagePlayer(v) {
        if (!player.alive) return;
        const before = player.hp;

        player.hp -= v;
        if (player.hp < 0) player.hp = 0;

        // 受傷且還活著 → 叫一聲
        if (player.hp < before && player.hp > 0 && sfx.playerHurt) {
          sfx.playerHurt();
        }

        updateHUD();
        if (player.hp <= 0) {
          player.alive = false;
          sfx.die();
          stopBgm(); // 死亡停止 BGM（下面會定義）
          showDeath();
        }
      }

      function showDeath() {
        document.getElementById("death").style.display = "flex";
        document.getElementById("retryLink").onclick = (e) => {
          e.preventDefault();
          window.location.reload();
        };
      }

      var hpEl = document.getElementById("hp"),
        ammoEl = document.getElementById("ammo"),
        lootEl = document.getElementById("loot");
      function updateHUD() {
        hpEl.textContent = Math.round(player.hp);
        ammoEl.textContent = player.ammo;
        lootEl.textContent = player.loot;
      }

      function updateHotbarUI() {
        if (!hotbarEl) return;
        hotbarEl.classList.remove("hidden");
        const slots = slotEls();
        slots.forEach((el, i) => {
          const it = inventory[i];
          el.style.outline = i === hotbarIndex ? "2px solid #14a1ff" : "none";
          el.textContent = it
            ? it.type === ITEM_TYPES.MEDKIT
              ? "🧰"
              : it.type === ITEM_TYPES.AMMO
              ? "🔫"
              : "🔑"
            : String(i + 1);
          el.title = it
            ? it.type === ITEM_TYPES.MEDKIT
              ? "醫療包 (+40 HP)"
              : it.type === ITEM_TYPES.AMMO
              ? "彈藥 (+15 Ammo)"
              : "鑰匙（保留）"
            : "空";
        });
      }

      function setHotbarIndex(i) {
        hotbarIndex = Math.max(0, Math.min(HOTBAR_SIZE - 1, i));
        updateHotbarUI();
      }

      function putIntoHotbar(itemType) {
        // 找空格；若都滿，覆蓋當前選取格
        let idx = inventory.findIndex((v) => !v);
        if (idx < 0) idx = hotbarIndex;
        inventory[idx] = { type: itemType };
        updateHotbarUI();
      }

      function getInputDir() {
        const v = new THREE.Vector3();
        if (keyState["w"] || keyState["arrowup"]) v.z -= 1;
        if (keyState["s"] || keyState["arrowdown"]) v.z += 1;
        if (keyState["a"] || keyState["arrowleft"]) v.x -= 1;
        if (keyState["d"] || keyState["arrowright"]) v.x += 1;
        if (v.lengthSq() > 0) v.normalize();
        return v;
      }

      // 把 input 轉到玩家面向的世界座標
      function toWorldDir(localDir, yaw) {
        const sin = Math.sin(yaw);
        const cos = Math.cos(yaw);

        // 角色面向（forward）：看哪裡 → 就是哪裡
        const fwdX = sin;
        const fwdZ = cos;

        // 角色右側（right）：forward 右轉 90°
        const rightX = -cos;
        const rightZ = sin;

        // 你的定義是：W → localDir.z = -1
        // 所以「前進量」要用 -localDir.z
        const forwardAmt = -localDir.z; // W=-1 → +1 前進
        const rightAmt = localDir.x; // D=+1 → 向右

        const wx = rightX * rightAmt + fwdX * forwardAmt;
        const wz = rightZ * rightAmt + fwdZ * forwardAmt;

        return new THREE.Vector3(wx, 0, wz);
      }

      function handleMovement(dt) {
        if (!player || !player.obj) return;

        const inputDir = getInputDir();
        let moveDir = inputDir;

        // 只有你真的有在看某個方向的時候才轉換（有時候開場還沒對準心）
        if (inputDir.lengthSq() > 0 && player.obj) {
          const yaw = player.obj.rotation.y;
          moveDir = toWorldDir(inputDir, yaw);
        }

        const speed = player.speed * dt;
        const next = player.obj.position.clone();
        next.x += moveDir.x * speed;
        next.z += moveDir.z * speed;

        // 原本就有的：邊界/牆面推擠
        const resolved = resolveCollision(next);
        player.obj.position.copy(resolved);

        // 一樣做貼地
        const gy = getGroundYAt(player.obj.position.x, player.obj.position.z);
        const cushion = (player.halfSize?.y || 1.2) * 0.9;
        player.obj.position.y = gy + cushion;
      }

      // --- Camera control (v0.3.4) ---
      function toRad(deg) {
        return (deg * Math.PI) / 180;
      }

      function yawVector(camDist, yawDeg) {
        const t = toRad(yawDeg);
        return new THREE.Vector3(
          camDist * Math.sin(t),
          0,
          camDist * Math.cos(t)
        );
      }

      function pitchHeight(camDist, pitchDeg) {
        return camDist * Math.tan(toRad(pitchDeg));
      }

      function cameraOffset(pitchDeg, yawDeg, camDist) {
        const flat = yawVector(camDist, yawDeg);
        const h = pitchHeight(camDist, pitchDeg);
        return new THREE.Vector3(flat.x, h, flat.z);
      }

      function updateCamera(dt) {
        if (!player || !player.obj) return;

        // 👇 相機三參數，可自由微調
        const cameraPitch = 60; // 比 60 再低一點，動感一點
        const cameraYaw = 255; // 跟原本右後上差不多
        const camDist = 45; // 稍遠一點，整體比例舒服

        const offset = cameraOffset(cameraPitch, cameraYaw, camDist);
        const targetPos = player.obj.position.clone().add(offset);

        // 平滑跟隨（lerp）
        camera.position.lerp(targetPos, Math.min(dt * 5, 1));

        // 鏡頭永遠看著角色上半身
        const lookAt = player.obj.position
          .clone()
          .add(new THREE.Vector3(0, player.halfSize.y * 0.8, 0));
        camera.lookAt(lookAt);
      }

      // === Exit Manager ===
      const exits = [];

      function makeExitDoors() {
        exits.length = 0; // 清空舊的 exit（保險）

        const margin = 60;
        // 路的「終點」：世界右邊一點的位置
        const endX = WORLD_SIZE / 2 - margin;
        const endZ = getPathCenterZ(endX);
        const y = getGroundYAt(endX, endZ) + 4;

        const door = new THREE.Mesh(
          new THREE.BoxGeometry(10, 8, 2),
          new THREE.MeshStandardMaterial({
            color: 0x4fd1c5,
            emissive: 0x2dd4bf,
            emissiveIntensity: 0.6,
          })
        );
        door.position.set(endX, y, endZ);
        door.userData.kind = "exit";
        scene.add(door);
        exits.push(door);

        // EXIT 文字 Billboard
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 256;
        canvas.height = 64;
        ctx.fillStyle = "rgba(0,0,0,0)";
        ctx.font = "bold 36px sans-serif";
        ctx.fillStyle = "#00ffff";
        ctx.textAlign = "center";
        ctx.fillText("EXIT", 128, 45);

        const tex = new THREE.CanvasTexture(canvas);
        const label = new THREE.Mesh(
          new THREE.PlaneGeometry(30, 8),
          new THREE.MeshBasicMaterial({ map: tex, transparent: true })
        );
        label.position.set(endX, y + 10, endZ);

        // 讓牌子大致朝向地圖中心（看起來比較像對玩家）
        label.lookAt(new THREE.Vector3(0, y + 10, 0));

        scene.add(label);
      }

      // 每幀檢查距離
      function checkExitProximity() {
        if (!player.obj || exits.length === 0) return;
        const p = player.obj.position;

        for (const door of exits) {
          const dx = door.position.x - p.x;
          const dz = door.position.z - p.z;
          const dist = Math.sqrt(dx * dx + dz * dz);

          if (dist < 60) {
            showExitTip("F to use Key 🔑");
            if (keyState["f"]) {
              if (hasKeyInInventory()) {
                consumeKey();
                showVictory();
                log(
                  `Successful evacuation!
                  Duck model by rbreve on Sketchfab (CC-BY 4.0)
                  https://creativecommons.org/licenses/by/4.0/
                  Dog model by ofekyovel on Sketchfab (CC-BY 4.0)`,
                  "ok"
                );
              } else {
                log("Need Key to open the door", "warn");
              }
            }
            return; // 只處理最近一個
          }
        }

        hideExitTip();
      }

      function hasKeyInInventory() {
        return inventory.some((it) => it && it.type === ITEM_TYPES.KEY);
      }

      function consumeKey() {
        const idx = inventory.findIndex(
          (it) => it && it.type === ITEM_TYPES.KEY
        );
        if (idx >= 0) {
          inventory[idx] = null;
          updateHotbarUI();
          log("使用鑰匙 🔑", "ok");
        }
      }

      function showVictory() {
        stopBgm();
        const box = document.getElementById("death");
        box.style.display = "flex";
        box.querySelector("h2").textContent = "Victory!";
        box.querySelector("p").textContent = "You managed to escape。";
      }

      function showExitTip(msg) {
        const tip = document.getElementById("pickupTip");
        if (!tip) return;
        tip.textContent = msg;
        tip.classList.remove("hidden");
      }

      function hideExitTip() {
        const tip = document.getElementById("pickupTip");
        if (!tip) return;
        tip.classList.add("hidden");
      }

      async function init() {
        await makePlayer();
        await loadEnemyDuck();
        spawnEnemies(10);
        scatterItems();
        makeExitDoors();
        hotbarEl && hotbarEl.classList.remove("hidden");
        updateHotbarUI();
        animate();
      }
      function animate() {
        if (!player || !player.obj) {
          requestAnimationFrame(animate);
          return;
        }
        const dt = clock.getDelta();
        requestAnimationFrame(animate);
        if (player.alive && player.obj) {
          handleMovement(dt);
          facePlayerToAim(0.25); // ← 讓主角跟著準心轉
          for (let i = enemies.length - 1; i >= 0; i--) {
            const en = enemies[i];
            if (!en || typeof en.update !== "function") {
              enemies.splice(i, 1);
              continue;
            }
            // 就算 en.mesh 還沒載好，也先讓它 update（移動、貼地）
            en.update(dt);
          }
          // === 敵人之間的簡易分離（依實際模型大小） ===
          for (let i = 0; i < enemies.length; i++) {
            const a = enemies[i];
            if (!a || !a.root) continue;
            for (let j = i + 1; j < enemies.length; j++) {
              const b = enemies[j];
              if (!b || !b.root) continue;

              const ax = a.root.position.x;
              const az = a.root.position.z;
              const bx = b.root.position.x;
              const bz = b.root.position.z;

              const dx = bx - ax;
              const dz = bz - az;
              const d2 = dx * dx + dz * dz;
              if (d2 < 0.0001) continue;

              const d = Math.sqrt(d2);

              // 依照各自 hitR 來決定要不要推
              const aR = a.hitR || 15; // ← 如果還沒算到，就用 15 當保底
              const bR = b.hitR || 15;
              const wanted = (aR + bR) * 0.8; // 要保持的距離（抓 80% 寬度）

              if (d < wanted) {
                const overlap = wanted - d;
                const nx = dx / d;
                const nz = dz / d;
                const push = overlap * 0.5;

                a.root.position.x -= nx * push;
                a.root.position.z -= nz * push;
                b.root.position.x += nx * push;
                b.root.position.z += nz * push;

                // 再貼地
                a.root.position.y = getGroundYAt(
                  a.root.position.x,
                  a.root.position.z
                );
                b.root.position.y = getGroundYAt(
                  b.root.position.x,
                  b.root.position.z
                );
              }
            }
          }

          // === 敵人 vs 主角 分離 ===
          const PLAYER_PUSH_DIST = 24; // 想要主角跟鴨子至少維持的距離 (依你現在超大模型調)
          const PLAYER_PUSH_STRENGTH = 0.55;

          for (let i = 0; i < enemies.length; i++) {
            const en = enemies[i];
            if (!en || !en.root || !player.obj) continue;

            const ex = en.root.position.x;
            const ez = en.root.position.z;
            const px = player.obj.position.x;
            const pz = player.obj.position.z;

            const dx = ex - px;
            const dz = ez - pz;
            const d2 = dx * dx + dz * dz;
            if (d2 < 0.0001) continue;

            const d = Math.sqrt(d2);
            if (d < PLAYER_PUSH_DIST) {
              const overlap = PLAYER_PUSH_DIST - d;
              const nx = dx / d;
              const nz = dz / d;

              // 把敵人往外推一點
              en.root.position.x += nx * overlap * PLAYER_PUSH_STRENGTH;
              en.root.position.z += nz * overlap * PLAYER_PUSH_STRENGTH;
              en.root.position.y = getGroundYAt(
                en.root.position.x,
                en.root.position.z
              );

              // （可選）也把玩家往反方向推一點，做出互撞感
              // player.obj.position.x -= nx * overlap * 0.15;
              // player.obj.position.z -= nz * overlap * 0.15;
            }
          }

          // 更新子彈
          for (let i = bullets.length - 1; i >= 0; i--) {
            if (!bullets[i].update(dt)) bullets.splice(i, 1);
          }
          updateCamera(dt);
          checkExitProximity();

          // 更新 3D 地面準心
          if (hasMouse && ground) {
            aimRay.setFromCamera(mouse, camera);
            const hits = aimRay.intersectObject(ground, true);
            if (hits && hits.length) {
              aimPoint = hits[0].point;
              crosshair.position.set(aimPoint.x, 0.02, aimPoint.z);
              crosshair.visible = true;
            }
          }
        }
        renderer.render(scene, camera);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
